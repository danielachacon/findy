<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
        <h2 class="text-2xl font-bold text-center text-blue-900 mb-4">Hello {{ user.username }},</h2>
        <p class="text-base leading-6 mb-4">Thank you for registering. To activate your account, please click the link below:</p>
        <p class="text-center mb-4">
            <a href="{{ token_url }}" class="text-blue-500 hover:underline">Activate My Account</a>
        </p>
        <p class="text-base leading-6 mb-4">Once you have activated your account, you can log in using the link below:</p>
        <p class="text-center">
            <a href="{{ login_url }}" class="text-blue-500 hover:underline">Login</a>
        </p>
        <p class="text-sm text-gray-600 mt-6">If you did not register for this account, please ignore this email.</p>
    </div>
</body>
</html>
