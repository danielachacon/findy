{% extends 'base.html' %}
{% load static %}

{% block title %}Welcome to Findy{% endblock %}

{% block content %}
<div class="text-center mt-10">
    <img src="{% static 'img/buzz.png' %}" alt="Georgia Tech Buzz Mascot" class="mascot-logo">
    <h1 class="text-4xl font-bold text-blue-900 mb-4">Findy</h1>
    <p class="text-lg text-gray-700 mb-4">Hello, You're now logged in.</p>
    <p class="text-lg text-gray-700 mb-6">Ready to explore events happening at Georgia Tech?</p>

    <form action="{% url 'main' %}" method="get">
        <button type="submit" class="bg-[#003057] hover:bg-[#002240] text-white py-2 px-4 rounded-md font-semibold transition duration-200">
            Go To Events
        </button>
    </form>
</div>
{% endblock %}
