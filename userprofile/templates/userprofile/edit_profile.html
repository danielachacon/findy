<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Edit Profile{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    {% block content %}
    <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-xl mt-16 border border-gray-200">
        <h2 class="text-3xl font-extrabold text-center text-[#003057] mb-8">Edit Profile</h2>
        <form method="POST" action="{% url 'edit_profile' %}" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="id_profile_picture" class="block text-sm font-semibold text-gray-700 mb-1">Profile Picture</label>
                <input type="file" id="id_profile_picture" name="profile_picture" class="block w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-[#003057] file:text-white hover:file:bg-[#002240] cursor-pointer border border-gray-300 rounded-md shadow-sm focus:border-[#B3A369] focus:ring-[#B3A369]">
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-[#003057] hover:bg-[#002240] text-white py-3 px-6 rounded-lg font-semibold transition-all duration-300 shadow-md">Save Changes</button>
            </div>
        </form>
    </div>
    {% endblock %}
  </body>
</html>
